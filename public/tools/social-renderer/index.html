<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>AimCodes 推广素材渲染器</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #060c12;
        color: #f5f7f8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          radial-gradient(circle at 22% 10%, rgba(255, 91, 87, 0.12), transparent 30%),
          #060c12;
      }

      main {
        width: min(100%, 1240px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 24px;
        align-items: start;
      }

      canvas {
        width: 100%;
        max-height: 82vh;
        object-fit: contain;
        background: #0b141c;
        border: 1px solid #293946;
        border-radius: 18px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
      }

      aside {
        padding: 22px;
        border: 1px solid #293946;
        border-radius: 18px;
        background: #0c151d;
      }

      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 20px; color: #9eabb5; line-height: 1.65; }

      label {
        display: block;
        margin: 18px 0 8px;
        color: #d7dee3;
        font-size: 14px;
        font-weight: 700;
      }

      select,
      input[type="number"] {
        width: 100%;
        min-height: 48px;
        padding: 0 12px;
        border: 1px solid #3a4b57;
        border-radius: 10px;
        background: #111d26;
        color: #f5f7f8;
        font: inherit;
      }

      .score-editor { margin-top: 18px; }
      .score-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }
      .score-heading > label { margin: 0; }
      .score-random {
        width: auto;
        min-height: 34px;
        margin: 0;
        padding: 0 12px;
        font-size: 12px;
      }
      .score-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .score-field label {
        margin: 0 0 6px;
        color: #84939e;
        font-size: 12px;
        font-weight: 650;
      }
      .score-field input {
        min-height: 44px;
        padding: 0 8px;
        text-align: center;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .score-summary {
        display: flex;
        align-items: baseline;
        gap: 7px;
        min-height: 38px;
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid rgba(37, 230, 230, 0.24);
        border-radius: 9px;
        background: rgba(37, 230, 230, 0.06);
        color: #9eabb5;
        font-size: 12px;
      }
      .score-summary strong {
        color: #f5f7f8;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
      }
      #score-rank { color: #f2c75c; font-weight: 800; }

      .field-hint {
        display: block;
        margin-top: 7px;
        color: #84939e;
        font-size: 12px;
        line-height: 1.5;
      }

      button {
        width: 100%;
        min-height: 50px;
        margin-top: 10px;
        border: 1px solid #3a4b57;
        border-radius: 10px;
        background: #111d26;
        color: #f5f7f8;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.primary { border-color: #ff5b57; background: #ff5b57; color: #071016; }
      button:disabled { cursor: wait; opacity: 0.55; }
      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .button-row button { min-width: 0; }
      .check-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 12px;
        color: #d7dee3;
        font-size: 13px;
        line-height: 1.5;
        cursor: pointer;
      }
      .check-row input { margin-top: 3px; accent-color: #ff5b57; }
      .download-destination {
        margin-top: 16px;
        padding: 12px;
        border: 1px solid #2c3d49;
        border-radius: 12px;
        background: rgba(17, 29, 38, 0.72);
      }
      .download-destination-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .download-destination-title {
        color: #d7dee3;
        font-size: 14px;
        font-weight: 800;
      }
      .download-destination-badge {
        flex: 0 0 auto;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(37, 230, 230, 0.1);
        color: #82e8e8;
        font-size: 11px;
        font-weight: 800;
      }
      .download-destination-path {
        margin-top: 8px;
        color: #f5f7f8;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .download-destination-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .download-destination-actions button {
        min-width: 0;
        min-height: 44px;
      }
      .download-destination-actions button:disabled { cursor: not-allowed; }
      .publish-ready {
        margin-top: 16px;
        padding: 12px 14px;
        border: 1px solid rgba(67, 223, 138, 0.34);
        border-radius: 10px;
        background: rgba(67, 223, 138, 0.08);
        color: #a7f3cc;
        font-size: 12px;
        line-height: 1.55;
      }
      #status { margin-top: 18px; min-height: 48px; font-size: 14px; color: #82e8e8; }

      @media (max-width: 820px) {
        main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="promo" width="1080" height="1080" aria-label="AimCodes 推广素材预览"></canvas>
      <aside>
        <h1>推广素材渲染器</h1>
        <p>选择平台、语言和准星，直接导出符合短视频平台尺寸与安全区的成片。</p>
        <label for="language">素材语言</label>
        <select id="language">
          <option value="zh-cn">简体中文</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="pt-br">Português (Brasil)</option>
        </select>
        <label for="crosshair">选择准星</label>
        <select id="crosshair" aria-label="选择要渲染的准星"></select>
        <span class="field-hint" id="crosshair-count"></span>
        <div class="score-editor">
          <div class="score-heading">
            <label for="score-1">测试成绩（毫秒）</label>
            <button class="score-random" id="random-scores" type="button">随机一组</button>
          </div>
          <div class="score-grid">
            <div class="score-field">
              <label for="score-1">第 1 次</label>
              <input id="score-1" type="number" min="100" max="999" step="1" inputmode="numeric" value="224" />
            </div>
            <div class="score-field">
              <label for="score-2">第 2 次</label>
              <input id="score-2" type="number" min="100" max="999" step="1" inputmode="numeric" value="211" />
            </div>
            <div class="score-field">
              <label for="score-3">第 3 次</label>
              <input id="score-3" type="number" min="100" max="999" step="1" inputmode="numeric" value="219" />
            </div>
          </div>
          <div class="score-summary" aria-live="polite">
            <span>平均</span>
            <strong id="score-average">218 ms</strong>
            <span>·</span>
            <span id="score-rank">钻石</span>
          </div>
          <span class="field-hint">三次成绩会按点击顺序出现，平均值和反应段位自动计算。</span>
        </div>
        <label for="platform">发布平台</label>
        <select id="platform">
          <option value="universal">通用竖版（推荐，一稿多发）</option>
          <option value="tiktok">TikTok</option>
          <option value="instagram">Instagram Reels</option>
          <option value="youtube">YouTube Shorts</option>
        </select>
        <span class="field-hint" id="platform-hint"></span>
        <label for="video-format">视频格式</label>
        <select id="video-format">
          <option value="mp4">MP4（推荐，手机直接发布）</option>
          <option value="webm">WebM（备用）</option>
        </select>
        <span class="field-hint">MP4 优先使用 H.264；若浏览器不支持，会提示改用 WebM。</span>
        <label class="check-row" for="include-audio">
          <input id="include-audio" type="checkbox" checked />
          <span>加入轻量提示音轨，上传社媒后无需另外补音轨</span>
        </label>
        <label class="check-row" for="show-safe-zone">
          <input id="show-safe-zone" type="checkbox" checked />
          <span>预览平台安全区（只显示在预览，不会写入成片）</span>
        </label>
        <div class="download-destination">
          <div class="download-destination-heading">
            <span class="download-destination-title">保存位置</span>
            <span class="download-destination-badge" id="download-folder-badge">浏览器默认</span>
          </div>
          <div class="download-destination-path" id="download-folder-path">文件将保存到浏览器默认下载目录</div>
          <div class="download-destination-actions">
            <button id="choose-download-folder" type="button">选择文件夹</button>
            <button id="reset-download-folder" type="button" disabled>恢复默认</button>
          </div>
          <span class="field-hint" id="download-folder-hint">选择一次后，本轮导出的视频、封面和方形图都会进入该文件夹。</span>
        </div>
        <button class="primary" id="render-video">导出可直接发布的 MP4</button>
        <div class="button-row">
          <button id="preview-video">预览竖版视频</button>
          <button id="download-cover">导出竖版封面</button>
        </div>
        <div class="button-row">
          <button id="download-square">导出方形图</button>
          <button id="preview-square">恢复方形预览</button>
        </div>
        <div class="publish-ready" id="publish-ready">1080 × 1920 · 30 FPS · H.264 MP4 · 平台安全区</div>
        <div id="status" role="status">正在载入素材…</div>
      </aside>
    </main>

      }
      const SECTION_MARKERS = new Set(['P', 'A', 'S'])

      function parseCrosshairCode(value, { fallbackColor } = {}) {
        const code = String(value || '').trim().replace(/\s+/g, '')
        const tokens = code.split(';').filter(Boolean)
        const primaryIndex = tokens.indexOf('P')
        if (primaryIndex === -1) throw new Error('准星代码缺少主配置')

        const values = new Map()
        for (let index = primaryIndex + 1; index < tokens.length; index += 2) {
          const key = tokens[index]
          if (SECTION_MARKERS.has(key)) break
          const itemValue = tokens[index + 1]
          if (!key || itemValue === undefined || SECTION_MARKERS.has(itemValue)) break
          values.set(key, itemValue)
        }

        const numberValue = (key, fallback, min = -Infinity, max = Infinity) => {
          if (!values.has(key)) return fallback
          const parsed = Number(values.get(key))
          return Number.isFinite(parsed) ? Math.min(max, Math.max(min, parsed)) : fallback
        }
        const booleanValue = (key, fallback) => values.has(key) ? values.get(key) !== '0' : fallback
        const lineSettings = (prefix, defaults) => {
          const horizontalLength = numberValue(`${prefix}l`, defaults.length, 0, 20)
          const verticalLength = booleanValue(`${prefix}g`, false)
            ? numberValue(`${prefix}v`, horizontalLength, 0, 20)
            : horizontalLength
          const opacity = numberValue(`${prefix}a`, defaults.opacity, 0, 1)
          return {
            enabled: booleanValue(`${prefix}b`, true) && opacity > 0 && (horizontalLength > 0 || verticalLength > 0),
            opacity,
            horizontalLength,
            verticalLength,
            thickness: numberValue(`${prefix}t`, defaults.thickness, 0, 10),
            offset: numberValue(`${prefix}o`, defaults.offset, 0, 20),
          }
        }

        let color = COLOR_PRESETS[values.get('c') ?? 0] || COLOR_PRESETS[0]
        if (values.get('c') === '8') {
          const rgb = (values.get('u') || '').replace(/^#/, '').slice(0, 6)
          color = /^[0-9a-f]{6}$/i.test(rgb) ? `#${rgb}` : (fallbackColor || '#ffffff')
        }
        const outlineOpacity = numberValue('o', 0.5, 0, 1)
        return {
          code,
          color,
          settings: {
            outline: {
              enabled: booleanValue('h', true) && outlineOpacity > 0,
              opacity: outlineOpacity,
              thickness: numberValue('t', 1, 1, 6),

            outer: lineSettings('1', { length: 2, thickness: 2, offset: 10, opacity: 0.35 }),

      function fittedText(text, x, y, maxWidth, { weight = 800, size = 48, min = 20, color = COLORS.white, align = 'left' } = {}) {
        let currentSize = size
        ctx.font = font(weight, currentSize)
        while (ctx.measureText(text).width > maxWidth && currentSize > min) {
          currentSize -= 2
          ctx.font = font(weight, currentSize)
        }
        ctx.fillStyle = color
        ctx.textAlign = align
        ctx.fillText(text, x, y)
        ctx.textAlign = 'left'
      }

      function roundedRect(context, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2)
        context.beginPath()
        context.moveTo(x + r, y)
        context.arcTo(x + width, y, x + width, y + height, r)
        context.arcTo(x + width, y + height, x, y + height, r)
        context.arcTo(x, y + height, x, y, r)
        context.arcTo(x, y, x + width, y, r)
        context.closePath()
      }

      function fillRound(x, y, width, height, radius, fill, stroke = null, lineWidth = 1) {
        roundedRect(ctx, x, y, width, height, radius)
        ctx.fillStyle = fill
        ctx.fill()
        if (stroke) {
          ctx.strokeStyle = stroke
          ctx.lineWidth = lineWidth
          ctx.stroke()
        }
      }

      function drawCover(image, x, y, width, height, focusX = 0.52, focusY = 0.5) {
        const imageRatio = image.naturalWidth / image.naturalHeight
        const targetRatio = width / height
        let sourceWidth = image.naturalWidth
        let sourceHeight = image.naturalHeight
        let sourceX = 0
        let sourceY = 0

        if (imageRatio > targetRatio) {
          sourceWidth = image.naturalHeight * targetRatio
          sourceX = (image.naturalWidth - sourceWidth) * focusX
        } else {
          sourceHeight = image.naturalWidth / targetRatio
          sourceY = (image.naturalHeight - sourceHeight) * focusY
        }

        ctx.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, x, y, width, height)
      }

      function drawGrid(width, height, alpha = 0.08, size = 72) {
        ctx.save()
        ctx.strokeStyle = `rgba(117, 157, 178, ${alpha})`
        ctx.lineWidth = 1
        for (let x = 0; x <= width; x += size) {
          ctx.beginPath()
          ctx.moveTo(x, 0)
          ctx.lineTo(x, height)
          ctx.stroke()
        }
        for (let y = 0; y <= height; y += size) {
          ctx.beginPath()
          ctx.moveTo(0, y)
          ctx.lineTo(width, y)
          ctx.stroke()
        }
        ctx.restore()
      }

      function drawBrand(x, y, scale = 1, color = COLORS.white) {
        const logoSize = 54 * scale
        ctx.save()
        ctx.drawImage(brandImage, x - logoSize / 2, y - logoSize / 2, logoSize, logoSize)
        ctx.fillStyle = color

      function drawCornerFrame(x, y, width, height, color = COLORS.red, length = 34, thickness = 5) {
        ctx.save()
        ctx.strokeStyle = color
        ctx.lineWidth = thickness
        const corners = [
          [x, y, 1, 1], [x + width, y, -1, 1], [x, y + height, 1, -1], [x + width, y + height, -1, -1],
        ]
        for (const [cx, cy, dx, dy] of corners) {
          ctx.beginPath()
          ctx.moveTo(cx + dx * length, cy)
          ctx.lineTo(cx, cy)
          ctx.lineTo(cx, cy + dy * length)
          ctx.stroke()
        }
        ctx.restore()
      }

      function drawCrosshairRect(x, y, width, height, color, alpha, outline) {
        ctx.save()
        const parentAlpha = ctx.globalAlpha
        if (outline.enabled) {
          ctx.globalAlpha = parentAlpha * outline.opacity
          ctx.fillStyle = '#020609'
          const pad = outline.thickness * 2
          ctx.fillRect(x - pad, y - pad, width + pad * 2, height + pad * 2)
        }
        ctx.globalAlpha = parentAlpha * alpha
        ctx.fillStyle = color
        ctx.fillRect(x, y, width, height)
        ctx.restore()
      }

      function drawCrosshair(cx, cy, baseScale = 5, color = activeParsedCrosshair.color, glow = true) {
        const scale = crosshairScale(baseScale)
        const { settings } = activeParsedCrosshair
        ctx.save()
        if (glow) {
          ctx.shadowColor = color
          ctx.shadowBlur = 14 * scale
        }

        const drawLines = (line) => {
          if (!line.enabled) return
          const hLength = Math.max(1, line.horizontalLength * scale)
          const vLength = Math.max(1, line.verticalLength * scale)
          const thickness = Math.max(1, line.thickness * scale)
          const offset = line.offset * scale
          const outline = {
            enabled: settings.outline.enabled,
            opacity: settings.outline.opacity,
            thickness: settings.outline.thickness * scale * 0.45,
          }
          drawCrosshairRect(cx + offset, cy - thickness / 2, hLength, thickness, color, line.opacity, outline)
          drawCrosshairRect(cx - offset - hLength, cy - thickness / 2, hLength, thickness, color, line.opacity, outline)
          drawCrosshairRect(cx - thickness / 2, cy + offset, thickness, vLength, color, line.opacity, outline)
          drawCrosshairRect(cx - thickness / 2, cy - offset - vLength, thickness, vLength, color, line.opacity, outline)
        }

        drawLines(settings.outer)
        drawLines(settings.inner)

        if (settings.dot.enabled) {
          const dotSize = settings.dot.size * scale
          drawCrosshairRect(
            cx - dotSize / 2,
            cy - dotSize / 2,
            dotSize,
            dotSize,
            color,
            settings.dot.opacity,
            {
              enabled: settings.outline.enabled,
              opacity: settings.outline.opacity,
              thickness: settings.outline.thickness * scale * 0.45,
            },
          )
        }
        ctx.restore()
      }

      function easeOut(value) {
        const v = Math.max(0, Math.min(1, value))
        return 1 - (1 - v) ** 3

      function fadeWindow(time, start, end, edge = 0.28) {
        return Math.max(0, Math.min(1, Math.min((time - start) / edge, (end - time) / edge)))

      function setScores(values, { updateUrl = true, redraw = true } = {}) {
        const normalized = values.map((value) => Math.min(SCORE_MAX, Math.max(SCORE_MIN, Math.round(Number(value)))))
        if (normalized.length !== 3 || normalized.some((value) => !Number.isFinite(value))) return false
        rounds.forEach((round, index) => { round.value = normalized[index] })
        updateScoreSummary()
        if (updateUrl) {

          url.searchParams.set('scores', normalized.join(','))
          window.history.replaceState(null, '', url)
        }
        if (redraw) redrawScorePreview()
        return true
      }

        const values = scoreInputs.map((input) => Number(input.value))
        if (values.some((value) => !Number.isFinite(value))) return false
        if (!clamp && values.some((value) => value < SCORE_MIN || value > SCORE_MAX)) return false
        return setScores(values)

      function drawReactionRound(time, round, index) {
        const root = copy()
        const t = root.video
        const end = round.start + 1.48
        const alpha = fadeWindow(time, round.start, end, 0.16)
        const relative = time - round.start
        withAlpha(alpha, () => {
          fittedText(t.round(index + 1), 72, 314, 920, { weight: 900, size: 56, min: 40 })
          fittedText(t.instruction, 72, 366, 920, { weight: 650, size: 28, min: 20, color: COLORS.muted })

          const isGo = relative >= 0.56 && relative < 0.95
          const hasResult = relative >= 0.95
          const panelFill = isGo ? '#19c96c' : 'rgba(7, 16, 22, 0.89)'
          const panelStroke = isGo ? '#8affbd' : 'rgba(98, 124, 140, 0.8)'
          fillRound(72, 430, 936, 980, 30, panelFill, panelStroke, 3)
          drawCornerFrame(104, 462, 872, 916, isGo ? '#effff5' : COLORS.red, 54, 7)

          ctx.textAlign = 'center'
          if (!isGo && !hasResult) {
            ctx.fillStyle = COLORS.muted
            ctx.font = font(800, 44)
            ctx.fillText(t.watch, 540, 830)
          } else if (isGo) {
            ctx.fillStyle = COLORS.ink
            ctx.font = font(950, 112)
            ctx.fillText(t.now, 540, 890)
            ctx.font = font(750, 34)
            ctx.fillText(t.tap, 540, 960)
          } else {
            ctx.fillStyle = COLORS.cyan
            ctx.font = font(950, 210)
            ctx.fillText(String(round.value), 540, 910)
            ctx.fillStyle = COLORS.white
            ctx.font = font(850, 48)
            ctx.fillText(root.unit, 540, 982)
            ctx.fillStyle = COLORS.muted
            ctx.font = font(700, 30)
            fittedText(index === 2 ? t.finish : t.next, 540, 1074, 760, { weight: 700, size: 30, min: 22, color: COLORS.muted, align: 'center' })
          }
          ctx.textAlign = 'left'

          const revealedCount = index + (hasResult ? 1 : 0)
          ctx.fillStyle = COLORS.muted
          ctx.font = font(700, 24)
          ctx.textAlign = 'center'
          for (let item = 0; item < 3; item += 1) {
            const itemX = 328 + item * 195
            if (item < revealedCount) {
              ctx.fillStyle = COLORS.muted
              ctx.fillText(String(rounds[item].value), itemX, 1505)
            }
            ctx.beginPath()
            ctx.arc(itemX, 1555, 13, 0, Math.PI * 2)
            ctx.fillStyle = item < revealedCount ? COLORS.cyan : '#35444e'
            ctx.fill()
          }
          ctx.textAlign = 'left'
        })
      }

      function drawResult(time) {
        const root = copy()
        const t = root.video
        const start = 6.05
        const end = 8.55
        const alpha = fadeWindow(time, start, end, 0.28)
        withAlpha(alpha, () => {
          const pop = 0.9 + easeOut((time - start) / 0.5) * 0.1

      async function writeBlobToDirectory(blob, filename) {
        const fileHandle = await downloadDirectoryHandle.getFileHandle(filename, { create: true })
        const writable = await fileHandle.createWritable()
        try {
          await writable.write(blob)
        } finally {
          await writable.close()
        }
      }

      async function downloadBlob(blob, filename) {
        if (!blob) throw new Error('导出文件生成失败')
        let fallbackError = null

        if (downloadDirectoryHandle) {
          try {
            await writeBlobToDirectory(blob, filename)
            return { mode: 'folder', folderName: downloadDirectoryHandle.name, filename }
          } catch (error) {
            console.error('写入自定义文件夹失败，已回退到默认下载目录。', error)
            fallbackError = error
            downloadDirectoryHandle = null
            updateDownloadFolderUi()
          }
        }

        const anchor = document.createElement('a')
        const url = URL.createObjectURL(blob)
        anchor.href = url
        anchor.download = filename
        document.body.appendChild(anchor)
        anchor.click()
        anchor.remove()
        window.setTimeout(() => URL.revokeObjectURL(url), 1500)
        return { mode: 'browser', filename, fallbackError }
      }

      function savedToText(result) {
        if (result.mode === 'folder') return `已保存到“${result.folderName}”文件夹。`
        if (result.fallbackError) return '自定义文件夹暂时不可用，已改存浏览器默认下载目录。'
        return '已发送到浏览器默认下载目录。'
      }

      function scheduleTone(audioContext, target, at, frequency, duration, volume, type = 'sine') {
        const oscillator = audioContext.createOscillator()
        const gain = audioContext.createGain()
        const start = audioContext.currentTime + at
        oscillator.type = type
        oscillator.frequency.setValueAtTime(frequency, start)
        gain.gain.setValueAtTime(0.0001, start)
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.018)
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration)
        oscillator.connect(gain)
        gain.connect(target)
        oscillator.start(start)
        oscillator.stop(start + duration + 0.02)
      }

      async function createSocialAudio() {
        if (!includeAudioInput.checked) return null
        const AudioContextClass = window.AudioContext || window.webkitAudioContext
        if (!AudioContextClass) return null
        const audioContext = new AudioContextClass()
        await audioContext.resume()
        const destination = audioContext.createMediaStreamDestination()

        scheduleTone(audioContext, destination, 0.08, 440, 0.16, 0.10, 'triangle')
        scheduleTone(audioContext, destination, 0.20, 660, 0.20, 0.08, 'triangle')
        rounds.forEach((round) => {
          scheduleTone(audioContext, destination, round.start + 0.56, 880, 0.13, 0.13, 'square')
          scheduleTone(audioContext, destination, round.start + 0.95, 520, 0.10, 0.08, 'triangle')
        })
        scheduleTone(audioContext, destination, 6.08, 392, 0.34, 0.08, 'triangle')
        scheduleTone(audioContext, destination, 6.20, 588, 0.38, 0.08, 'triangle')
        scheduleTone(audioContext, destination, 8.52, 740, 0.20, 0.08, 'sine')
        scheduleTone(audioContext, destination, 10.62, 494, 0.26, 0.09, 'triangle')
        scheduleTone(audioContext, destination, 10.78, 740, 0.32, 0.08, 'triangle')

        return {
          track: destination.stream.getAudioTracks()[0],
          close: () => audioContext.close(),
        }
      }

      function supportedVideoType(format = activeVideoFormat, withAudio = includeAudioInput.checked) {
        const candidates = format === 'mp4'
          ? [
              ...(withAudio ? [
                'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
                'video/mp4;codecs=avc3.42E01E,mp4a.40.2',
              ] : []),
              'video/mp4;codecs=avc3.42E01E',
              'video/mp4;codecs=avc1.42E01E',
              'video/mp4;codecs=avc1.64002A',
              'video/mp4',
            ]
          : [
              ...(withAudio ? [
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
              ] : []),
              'video/webm;codecs=vp9',
              'video/webm;codecs=vp8',
              'video/webm',
            ]
        return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || ''
      }

      async function renderVideo() {
        const format = activeVideoFormat
        const wantsAudio = includeAudioInput.checked
        const mimeType = supportedVideoType(format, wantsAudio)
        if (!mimeType) {
          status.textContent = format === 'mp4'
            ? '当前浏览器不能直接导出 MP4。请使用最新版 Chrome，或先选择 WebM。'
            : '当前浏览器不支持 WebM 导出，请改选 MP4。'
          return
        }

        setControlsDisabled(true)
        status.textContent = `正在逐帧渲染 ${VIDEO_DURATION} 秒 ${activePlatform().label} ${format.toUpperCase()} 成片，请稍候…`
        canvas.width = VIDEO_WIDTH
        canvas.height = VIDEO_HEIGHT

        let stream
        let audioSession
        try {
          stream = canvas.captureStream(0)
          const videoTrack = stream.getVideoTracks()[0]
          const canRequestFrames = typeof videoTrack?.requestFrame === 'function'
          if (!canRequestFrames) {
            stream.getTracks().forEach((track) => track.stop())
            stream = canvas.captureStream(VIDEO_FPS)
          }
          audioSession = await createSocialAudio()
          if (audioSession?.track) stream.addTrack(audioSession.track)
          const recorder = new MediaRecorder(stream, {
            mimeType,
            videoBitsPerSecond: 10_000_000,
            ...(audioSession?.track ? { audioBitsPerSecond: 128_000 } : {}),
          })
          const chunks = []
          recorder.addEventListener('dataavailable', (event) => {
            if (event.data.size > 0) chunks.push(event.data)
          })

          const finished = new Promise((resolve, reject) => {
            recorder.addEventListener('stop', resolve, { once: true })
            recorder.addEventListener('error', (event) => reject(event.error || new Error('视频编码失败')), { once: true })
          })
          recorder.start()
          const start = performance.now()

          if (canRequestFrames) {
            const totalFrames = Math.ceil(VIDEO_DURATION * VIDEO_FPS)
            for (let frameIndex = 0; frameIndex <= totalFrames; frameIndex += 1) {
              const elapsed = Math.min(VIDEO_DURATION, frameIndex / VIDEO_FPS)
              drawVideoFrame(elapsed)
              videoTrack.requestFrame()
              status.textContent = `正在渲染 ${localizedCrosshair().shortName}：${elapsed.toFixed(1)} / ${VIDEO_DURATION.toFixed(1)} 秒`
              const nextFrameAt = start + ((frameIndex + 1) * 1000) / VIDEO_FPS
              const wait = Math.max(0, nextFrameAt - performance.now())
              await new Promise((resolve) => window.setTimeout(resolve, wait))
            }
          } else {
            await new Promise((resolve) => {
              function frame(now) {
                const elapsed = (now - start) / 1000
                drawVideoFrame(Math.min(VIDEO_DURATION, elapsed))
                status.textContent = `正在渲染 ${localizedCrosshair().shortName}：${Math.min(VIDEO_DURATION, elapsed).toFixed(1)} / ${VIDEO_DURATION.toFixed(1)} 秒`
                if (elapsed < VIDEO_DURATION) requestAnimationFrame(frame)
                else resolve()
              }
              requestAnimationFrame(frame)
            })
          }

          recorder.stop()
          await finished

          const actualType = recorder.mimeType || mimeType
          const extension = format
          const blob = new Blob(chunks, { type: actualType })
          if (!blob.size) throw new Error('导出的视频文件为空')
          const result = await downloadBlob(blob, `aimcodes-${selectedCrosshair().id}-${activePlatform().file}-${copy().file}.${extension}`)
          window.__videoMime = actualType
          window.__videoExtension = extension
          window.__videoBlobSize = blob.size
          window.__videoHasAudio = Boolean(audioSession?.track)
          status.textContent = `${localizedCrosshair().shortName} 的 ${activePlatform().label} ${format.toUpperCase()} 成片已导出，${savedToText(result)}`
        } catch (error) {
          console.error(error)
          status.textContent = `视频导出失败：${error.message}`
        } finally {
          stream?.getTracks().forEach((track) => track.stop())
          await audioSession?.close()
          setControlsDisabled(false)
        }
      }

        updateScoreSummary()
        drawSquare()
        status.textContent = `已切换为${languageSelect.options[languageSelect.selectedIndex].text}。`
      })
      crosshairSelect.addEventListener('change', () => {
        setActiveCrosshair(crosshairSelect.value)
        const url = new URL(window.location.href)
        url.searchParams.set('crosshair', activeCrosshairId)
        window.history.replaceState(null, '', url)
        window.__selectedCrosshairCode = selectedCrosshair().code
        drawSquare()
        status.textContent = `已切换为“${localizedCrosshair().name}”。`
      })
      platformSelect.addEventListener('change', () => {
        activePlatformId = platformSelect.value
        const url = new URL(window.location.href)
        url.searchParams.set('platform', activePlatformId)
        window.history.replaceState(null, '', url)
        updatePlatformUi()
        drawVideoFrame(0.9, { showSafeGuide: showSafeZoneInput.checked })
        status.textContent = `已套用 ${activePlatform().label} 安全区与发布文案。`
      })
      videoFormatSelect.addEventListener('change', () => {
        activeVideoFormat = videoFormatSelect.value
        const url = new URL(window.location.href)
        url.searchParams.set('format', activeVideoFormat)
        window.history.replaceState(null, '', url)
        updatePlatformUi()
        const mimeType = supportedVideoType(activeVideoFormat)
        status.textContent = mimeType
          ? `${activeVideoFormat.toUpperCase()} 导出已就绪（${mimeType}）。`
          : `当前浏览器不支持 ${activeVideoFormat.toUpperCase()}，请切换另一种格式。`
      })
      includeAudioInput.addEventListener('change', () => {
        updatePlatformUi()
        const mimeType = supportedVideoType(activeVideoFormat, includeAudioInput.checked)
        status.textContent = includeAudioInput.checked
          ? (mimeType ? '提示音轨已开启，导出时会自动写入视频。' : '当前格式不支持带音轨，请切换格式或关闭音轨。')
          : '已关闭提示音轨，将导出静音视频。'
      })
      showSafeZoneInput.addEventListener('change', () => {
        if (canvas.width === VIDEO_WIDTH && canvas.height === VIDEO_HEIGHT) {
          drawVideoFrame(0.9, { showSafeGuide: showSafeZoneInput.checked })
        }
        status.textContent = showSafeZoneInput.checked
          ? '安全区辅助线已显示；它只用于预览。'
          : '安全区辅助线已隐藏。'
      })

      initialize().catch((error) => {
        console.error(error)
        status.textContent = `渲染器初始化失败：${error.message}`
      })
    </script>
  </body>
</html>
