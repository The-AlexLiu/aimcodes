name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Validate product data
        run: |
          pnpm validate:crosshairs
          pnpm validate:finder
          pnpm validate:localization
          pnpm validate:analytics

      - name: Build localized site
        run: pnpm build

      - name: Validate localized routes and SEO
        run: |
          pnpm validate:seo
          pnpm validate:routing
