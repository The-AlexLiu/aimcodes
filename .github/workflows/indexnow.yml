name: Notify IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for the Netlify deployment
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location https://aimcodes.com/sitemap.xml -o /tmp/aimcodes-sitemap.xml; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Notify IndexNow
        run: node scripts/submit-indexnow.mjs
