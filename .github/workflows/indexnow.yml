name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'netlify.toml'
      - 'src/data/**'
      - 'src/i18n/**'
      - 'src/seo/**'
      - 'scripts/generate-localized-routes.mjs'
      - 'scripts/submit-indexnow.mjs'
      - 'scripts/write-build-metadata.mjs'
      - 'public/*.txt'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for this commit on Netlify
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location "https://aimcodes.com/build-meta.json?commit=${GITHUB_SHA}" -o /tmp/aimcodes-build-meta.json; then
              if node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("/tmp/aimcodes-build-meta.json","utf8"));process.exit(value.commit===process.env.GITHUB_SHA?0:1)'; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Netlify did not publish ${GITHUB_SHA} within five minutes." >&2
          exit 1

      - name: Notify IndexNow
        run: node scripts/submit-indexnow.mjs
